name: Android build

on:
  push:
    branches: [main, feature/bot-autonomy-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name twitter --org com.sorodeleite .

      - name: Restore tracked app sources
        run: |
          git checkout -- lib/ pubspec.yaml
          rm -f test/widget_test.dart

      - name: Install build helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install fonttools brotli pillow

      - name: Build Apple emoji font
        run: python scripts/build-emoji-font.py

      - name: Configure Android manifest and icon
        run: python scripts/configure_android.py

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=2.0.0
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Sign APK with the project key
        run: python scripts/sign_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-android
          path: build/app/outputs/flutter-apk/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Twitter Android build #${{ github.run_number }}
          prerelease: false
          make_latest: true
          body: |
            Build automático do Twitter (vida revisada ♡).

            **Como atualizar:** abra o app e toque no ⋮ → "Atualizar aplicativo". Ele procura este release, baixa o APK e abre o instalador. Também dá para baixar o `app-release.apk` aqui nos Assets.

            ⚠️ Esta é a primeira build assinada com a chave fixa do projeto. Se você instalou uma versão anterior, desinstale uma única vez antes de instalar esta. Depois disso, todas as próximas atualizam por cima sem perder nada.
          files: build/app/outputs/flutter-apk/app-release-signed.apk
