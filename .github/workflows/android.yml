name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name twitter --org com.sorodeleite .

      - name: Restore tracked app sources
        run: |
          git checkout -- lib/main.dart pubspec.yaml
          flutter pub get
          rm -f test/widget_test.dart

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Twitter Android build #${{ github.run_number }}
          body: |
            Build automático do aplicativo Twitter para Android.

            Baixe o arquivo app-release.apk em Assets abaixo e instale no seu dispositivo.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
